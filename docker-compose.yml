name: aegisguard

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: aegisguard:local
    command: ["--config", "/etc/aegisguard/server.json"]
    environment:
      AEGISGUARD_STATUS_HOSTNAME: ${AEGISGUARD_STATUS_HOSTNAME:-localhost}
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./docker/seccomp.json
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run/aegisguard:rw,noexec,nosuid,size=1m,uid=65532,gid=65532,mode=0700
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:${AEGISGUARD_GAME_HOST_PORT:-18443}:18443/tcp"
      - "127.0.0.1:${AEGISGUARD_HTTP_HOST_PORT:-18444}:18444/tcp"
    volumes:
      - ./config/container.example.json:/etc/aegisguard/server.json:ro
    secrets:
      - source: server_certificate
        target: server_certificate
      - source: server_private_key
        target: server_private_key
      - source: admin_ca_certificate
        target: admin_ca_certificate
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/aegisguard_server
        - --config
        - /etc/aegisguard/server.json
        - --healthcheck
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

secrets:
  server_certificate:
    file: ${AEGISGUARD_SERVER_CERT_FILE:-${LOCALAPPDATA}/AegisGuard/secrets/server.pem}
  server_private_key:
    file: ${AEGISGUARD_SERVER_KEY_FILE:-${LOCALAPPDATA}/AegisGuard/secrets/server.key}
  admin_ca_certificate:
    file: ${AEGISGUARD_ADMIN_CA_FILE:-${LOCALAPPDATA}/AegisGuard/secrets/ca.pem}
