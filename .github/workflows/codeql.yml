name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasio-dev \
            libssl-dev \
            ninja-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: cpp
          build-mode: manual

      - name: Configure analyzed source
        run: cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build analyzed source
        run: cmake --build build-codeql --parallel 2

      - name: Upload CodeQL results
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
